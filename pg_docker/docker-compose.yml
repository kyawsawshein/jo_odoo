version: "3.9"

services:
  pgadmin:
    image: dpage/pgadmin4:7
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"   # access pgAdmin at http://localhost:5050
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: always
    networks:
      - jo_odoo_odoo-net

volumes:
  pgadmin-data:

networks:
  jo_odoo_odoo-net:
    external: true
